[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts", "build", "dist", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
